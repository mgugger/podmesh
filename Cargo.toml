[workspace]
resolver = "2"
members = [
    "podmesh-scheduler",
    "podmesh-proxy",
    "podmesh-sidecar",
    "tests",
    "podctl",
    "shared/axum_support",
    "shared/crypto",
    "shared/protocol",
    "shared/p2p",
]

[workspace.dependencies]
libp2p = { version = "0.56", features = [ "tokio", "gossipsub", "macros", "quic", "request-response", "kad", "dns" ] }
tokio = { version = "1" }
reqwest = { version = "0.12",  default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
env_logger = "0.11"
log = "0.4"
once_cell = "1.20"
base64 = "0.22"
anyhow = "1.0"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
futures = "0.3"
dirs = "6.0"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
thiserror = "1.0"
clap = { version = "4", features = ["derive"] }
podctl = { path = "./podctl" }
crypto = { path = "./shared/crypto" }
protocol = { path = "./shared/protocol" }
p2p = { path = "./shared/p2p" }
axum-support = { path = "./shared/axum_support" }
podmesh-scheduler = { path = "./podmesh-scheduler" }
podmesh-proxy = { path = "./podmesh-proxy" }
podmesh-sidecar = { path = "./podmesh-sidecar" }
postcard = { version = "1.1.3", features = ["alloc"] }
serde_bytes = "0.11"
parking_lot = "0.12"
lru = "0.12"
async-trait = "0.1"
axum = "0.8"
serial_test = "3.0"
zeroize = "1.5"
sha2 = "0.10"
regorus = { version = "0.5", default-features = false, features = ["std", "base64"] }
redb = "3.1"
blake3 = "1"
tempfile = "3"
hex = "0.4"
vsss-rs = { version = "5.3", default-features = false, features = ["std", "zeroize"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true