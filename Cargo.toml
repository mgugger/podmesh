[workspace]
resolver = "2"
members = [
    "podmesh-scheduler",
    "podmesh-proxy",
    "podmesh-sidecar",
    "tests",
    "podctl",
    "shared/axum_support",
    "shared/crypto",
    "shared/protocol",
    "shared/p2p",
]

[workspace.dependencies]
libp2p = { version = "0.56", features = [ "tokio", "gossipsub", "macros", "quic", "request-response", "kad", "dns" ] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11",  default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
env_logger = "0.10"
log = "0.4"
once_cell = "1.20"
base64 = "0.21"
anyhow = "1.0"
saorsa-pqc = "0.3"
futures = "0.3"
dirs = "4.0"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
thiserror = "1.0"
clap = { version = "4", features = ["derive"] }
podctl = { path = "./podctl" }
crypto = { path = "./shared/crypto" }
protocol = { path = "./shared/protocol" }
p2p = { path = "./shared/p2p" }
axum-support = { path = "./shared/axum_support" }
podmesh-scheduler = { path = "./podmesh-scheduler" }
podmesh-proxy = { path = "./podmesh-proxy" }
podmesh-sidecar = { path = "./podmesh-sidecar" }
postcard = { version = "1.1.3", features = ["alloc"] }
serde_bytes = "0.11"
parking_lot = "0.12"