[workspace]
resolver = "2"
members = [
    "machineplane",
    "workloadplane/workload",
    "workloadplane/gateway",
    "workloadplane/tests",
    "beectl",
    "shared/axum_support",
    "shared/crypto",
    "shared/protocol",
    "shared/p2p",
]

[workspace.dependencies]
libp2p = { version = "0.56", features = [ "tokio", "gossipsub", "macros", "quic", "request-response", "kad", "dns", "relay", "autonat", "identify"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11",  default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
env_logger = "0.10"
log = "0.4"
once_cell = "1.20"
base64 = "0.21"
anyhow = "1.0"
saorsa-pqc = "0.3"
futures = "0.3"
dirs = "4.0"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
thiserror = "1.0"
clap = { version = "4", features = ["derive"] }
beectl = { path = "./beectl" }
crypto = { path = "./shared/crypto" }
protocol = { path = "./shared/protocol" }
p2p = { path = "./shared/p2p" }
axum-support = { path = "./shared/axum_support" }
machine = { path = "./machineplane" }
workplane = { path = "./workloadplane/workload" }
workplane-gateway = { path = "./workloadplane/gateway" }
flatbuffers = "25.2.10"