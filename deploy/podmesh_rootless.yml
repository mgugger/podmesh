apiVersion: v1
kind: Pod
metadata:
  name: scheduler
  labels:
    app: scheduler
spec:
  restartPolicy: Always
  containers:
    - name: scheduler
      image: podmesh/scheduler:latest
      env:
      - name: RUST_LOG
        value: "info"
      ports:
        - containerPort: 3000
          hostPort: 3000
          protocol: TCP
    - name: agent
      image: podmesh/agent:latest
      env:
      - name: RUST_LOG
        value: "info"
      - name: CONTAINER_HOST
        value: "unix:///run/podman/podman.sock"
      args:
        - "--advertise-url"
        - "http://127.0.0.1:3100"
        - "--scheduler-url"
        - "http://127.0.0.1:3000"
        - "--key-dir"
        - "/var/lib/podmesh-agent/keys"
        - "--state-path"
        - "/var/lib/podmesh-agent/state.redb"
        - "--max-workloads"
        - "100"
      ports:
        - containerPort: 3100
          hostPort: 3100
          protocol: TCP
      volumeMounts:
        - name: podman-socket
          mountPath: /run/podman/podman.sock
        - name: agent-state
          mountPath: /var/lib/podmesh-agent
  volumes:
    - name: podman-socket
      hostPath:
        path: /run/user/1000/podman/podman.sock
        type: Socket
    - name: agent-state
      persistentVolumeClaim:
        claimName: podmesh-agent-state
---
apiVersion: v1
kind: Pod
metadata:
  name: proxy
  labels:
    app: podmesh
spec:
  restartPolicy: Always
  containers:
    - name: proxy-bootstrap
      image: podmesh/proxy:latest
      args:
        - "--enable-ingress"
        - "--enable-proxy-provider"
      env:
        - name: libp2p_quic_port
          value: "4002"
        - name: rest_api_port
          value: "3001"
        - name: RUST_LOG
          value: "debug"
      ports:
        - containerPort: 4002
          hostPort: 4002
          protocol: UDP
        - containerPort: 4002
          hostPort: 4002
          protocol: TCP
        - containerPort: 3001
          hostPort: 3001
          protocol: TCP
        - containerPort: 3001
          hostPort: 3001
          protocol: UDP
        - containerPort: 8080
          hostPort: 8080
          protocol: UDP
        - containerPort: 8080
          hostPort: 8080
          protocol: TCP
    - name: proxy-1
      image: podmesh/proxy:latest
      env:
      - name: RUST_LOG
        value: "info"
      args:
        - "--bootstrap-peer"
        - "/dns4/proxy/udp/4002/quic-v1"
        - "--disable-rest-api"
    - name: proxy-2
      image: podmesh/proxy:latest
      env:
      - name: RUST_LOG
        value: "info"
      args:
        - "--bootstrap-peer"
        - "/dns4/proxy/udp/4002/quic-v1"
        - "--disable-rest-api"
