apiVersion: v1
kind: Pod
metadata:
  name: sidecar-net-admin
spec:
  containers:
    - name: my-app
      image: docker.io/library/nginx
      ports:
        - containerPort: 80
    - name: sidecar
      image: localhost/podmesh/sidecar:latest
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
