apiVersion: v1
kind: Pod
metadata:
  name: sidecar-net-admin
spec:
  containers:
    - name: my-app
      image: docker.io/library/nginx
      ports:
        - containerPort: 80
    # Only the container podmesh injects may hold NET_ADMIN. The name is exact:
    # a tenant container called "sidecar" gets no exemption.
    - name: podmesh-sidecar
      image: localhost/podmesh/sidecar:latest
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
