[package]
name = "podmesh-scheduler"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
libp2p = { workspace = true, features = ["relay", "autonat", "identify"] }
futures = { workspace = true }
clap = { workspace = true, features = ["env"] }
once_cell = { workspace = true }
protocol = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
crypto = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
p2p = { workspace = true }
axum-support = { workspace = true }
parking_lot = { workspace = true }
lru = { workspace = true }
redb = { workspace = true }

[dev-dependencies]
podctl = { workspace = true }
reqwest = { workspace = true }
serial_test = { workspace = true }
# Enable debug-endpoints for integration tests in this crate
podmesh-scheduler = { path = ".", features = ["debug-endpoints"] }

[features]
default = []
podman-tests = []
# Enable debug REST endpoints (/debug/*) - only enable for testing
debug-endpoints = []