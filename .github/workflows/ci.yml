name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_podman:
        description: Build images and run real Podman integration tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --quiet --locked --workspace
      - run: cargo check --locked -p podmesh-integration-tests --features podman-tests --tests

  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - name: Check dependency policy
        run: |
          . .github/ci-tool-versions.env
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          cargo deny check

  podman-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.run_podman
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - name: Install and start Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman
          systemctl --user start podman.socket || (podman system service --time=0 "unix://${XDG_RUNTIME_DIR}/podman/podman.sock" &)
          for _ in $(seq 1 30); do podman info >/dev/null 2>&1 && break; done
          podman info >/dev/null
          echo "CONTAINER_HOST=unix://${XDG_RUNTIME_DIR}/podman/podman.sock" >> "$GITHUB_ENV"
      - name: Build run-scoped images
        run: |
          export PODMESH_IMAGE_TAG="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ./deploy/build_containers.sh
          for role in scheduler agent proxy sidecar; do podman tag "podmesh/$role:$PODMESH_IMAGE_TAG" "podmesh/$role:latest"; done
          podman network create podmesh
      - run: cargo test --locked -p podmesh-integration-tests --features podman-tests
